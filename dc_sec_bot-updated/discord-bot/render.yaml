services:
  - type: web
    name: dc-sec-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: UP_BOT_ID
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /health
